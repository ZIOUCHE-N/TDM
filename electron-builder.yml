appId: org.tdm.downloadmanager
productName: TDM
copyright: Copyright © 2026 TDM contributors

directories:
  output: dist
  buildResources: build

files:
  - out/**/*
  - package.json

extraResources:
  - from: LICENSE
    to: LICENSE
  - from: build/tray.png
    to: tray.png
  - from: build/notification.png
    to: notification.png
  - from: build/icon.png
    to: icon.png
  - from: extension
    to: extension
  - from: extension-firefox
    to: extension-firefox

asar: true

linux:
  target:
    - AppImage
    - deb
  category: Network
  icon: build/icons
  maintainer: TDM contributors
  synopsis: Gestionnaire de téléchargements HTTP/HTTPS
  description: >-
    TDM (Téléchargement Download Manager) télécharge des fichiers HTTP/HTTPS avec
    reprise, segments parallèles, files d'attente, catégories et planificateur local.
  artifactName: tdm-${version}-${arch}.${ext}
  syncDesktopName: true
  desktop:
    entry:
      Name: TDM
      Comment: Téléchargement Download Manager
      Categories: Network;FileTransfer;
      StartupWMClass: TDM

deb:
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libsecret-1-0

win:
  target:
    - nsis
  icon: build/icon.ico
  artifactName: tdm-${version}-${arch}-setup.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: TDM
